[package]
name = "mw-sim"
version = "0.1.0"
description = "Modern Wars simulation: pure Rust, no engine, no window."
edition.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1.1"
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
sha2 = "0.11"
