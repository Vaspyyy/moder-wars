[workspace]
resolver = "3"
members = ["sim", "godot"]

[workspace.package]
edition = "2024"
publish = false

# Tests decode real 6.5-million-cell maps; unoptimized code makes that slow.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The simulation is small to compile but does the heavy lifting at startup
# (decoding the map, building regions), so optimize it in debug builds too.
[profile.dev.package.mw-sim]
opt-level = 3
